<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口播导演工作台 · Talking Head Studio</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/palette.css"><link rel="stylesheet" href="/vendor/vditor/dist/index.css"><link rel="stylesheet" href="/v2.css"><link rel="stylesheet" href="/workflow.css"></head>
<body><div class="ambient"><i></i><i></i><i></i></div><div class="grain"></div>
<header class="topbar"><a class="brand" href="/" aria-label="口播导演工作台"><span class="brandmark"><b></b></span><span>口播导演<span class="brand-en">TALKING HEAD STUDIO</span></span></a><div class="project-switch"><select id="projects" aria-label="选择工程"></select><button class="icon-btn" id="new-project" title="新建工程">＋</button></div><div class="top-actions"><span id="save-status" class="save-status">本地工作空间</span><button class="ghost" id="undo">↶ 撤销</button><button class="ghost" id="agent-inbox" data-agent="list" disabled>AI 待办</button><button class="ghost" id="settings">设置</button><button class="key small" id="package">打包工程 ↗</button></div></header>
<nav class="stages" aria-label="制作阶段"><button data-stage="1" class="active"><span class="stage-number">01</span><span>写稿与录制</span><i>↗</i></button><div class="stage-wire"></div><button data-stage="2"><span class="stage-number">02</span><span>整理视频</span><i>↗</i></button><div class="stage-wire"></div><button data-stage="3"><span class="stage-number">03</span><span>字幕与导出</span><i>↗</i></button></nav>
<main id="main" aria-live="polite"></main>
<footer><span><i class="live-dot"></i> 工程保存在本机</span><span id="footer-meta"></span></footer>
<div id="jobbar" hidden><div class="job-orbit"></div><div><strong id="job-title">正在处理</strong><span id="job-message"></span></div><div class="job-progress"><i></i></div><span id="job-percent"></span></div>
<div id="toast" role="status" hidden></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-btn" id="close-dialog" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog>
<input id="file-picker" type="file" hidden><script src="/vendor/vditor/dist/index.min.js"></script><script src="/microphone.js"></script><script src="/app.js"></script><script src="/timeline.js"></script><script src="/finish.js"></script><script src="/workflow.js"></script><script src="/v2.js"></script><script src="/agents.js"></script><script>init()</script></body></html>
