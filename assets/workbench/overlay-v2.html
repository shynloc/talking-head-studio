<!doctype html><html><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:__WIDTH__px;height:__HEIGHT__px;background:transparent;overflow:hidden;font-family:'Microsoft YaHei',sans-serif}.layer{position:absolute;overflow:hidden;transform-origin:center}.layer img{width:100%;height:100%;object-fit:contain}.card{height:100%;padding:7%;border:2px solid #fff0d9;border-radius:18px;background:linear-gradient(130deg,#fff3df,#f6b36f);color:#483725;display:flex;flex-direction:column;justify-content:center;box-shadow:0 6px 12px #69472825}.card strong{font-size:clamp(16px,2.4vw,46px);line-height:1.3;color:#002fa7}.steps{display:flex;gap:8px;align-items:center;margin-top:10px}.steps span{padding:5px 10px;background:#fff7e8;border-radius:7px;font-size:clamp(10px,1.4vw,26px)}.steps span.active{color:#fff;background:#002fa7}</style><body><script>
__HCS_ENGINE__
const scenes=__SCENES__,fps=__FPS__,W=__WIDTH__,H=__HEIGHT__;const layers=new Map();
for(const s of [...scenes].sort((a,b)=>(a.layer||0)-(b.layer||0))){const el=document.createElement('div');el.className='layer';el.style.left=(s.fullscreen?0:(s.x??.06)*W)+'px';el.style.top=(s.fullscreen?0:(s.y??.04)*H)+'px';el.style.width=(s.fullscreen?W:(s.width??.35)*W)+'px';el.style.height=(s.fullscreen?H:(s.height??.2)*H)+'px';const pic=document.createElement('img');if(s.src||s.frames){el.append(pic);}else{const card=document.createElement('div');card.className='card';const title=document.createElement('strong');title.textContent=s.title;card.append(title);const steps=document.createElement('div');steps.className='steps';for(const x of s.steps||[]){const span=document.createElement('span');span.textContent=x;steps.append(span);}card.append(steps);el.append(card);}document.body.append(el);layers.set(s.id,{el,pic});}
window.ready=Promise.all(scenes.flatMap(s=>[s.src,...(s.frames||[]).map(f=>f.src)]).filter(Boolean).map(src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=()=>reject(Error('素材加载失败 '+src));im.src=src})));
window.renderAtFrame=function(frame){const t=frame/fps;let active=false;for(const s of scenes){const {el,pic}=layers.get(s.id),visible=s.enabled&&t>=s.start&&t<s.end;el.style.display=visible?'block':'none';if(!visible)continue;active=true;const state=valueAt(frame,{animation:{startFrame:s.start*fps,endFrame:(s.start+.2)*fps,easing:'easeOutCubic',from:{opacity:0,translateY:8,scale:.98},to:{opacity:1,translateY:0,scale:1}}});el.style.opacity=state.opacity;el.style.transform=`translateY(${state.translateY}px) scale(${state.scale})`;let src=s.src;if(s.frames){const tt=s.hold_last?Math.min(t-s.start,s.loop_duration-.0001):(t-s.start)%s.loop_duration;src=(s.frames.find(f=>f.start<=tt&&tt<f.end)||s.frames[0]).src;}if(src&&pic.getAttribute('src')!==src)pic.src=src;const steps=el.querySelectorAll('.steps span'),progress=(t-s.start)/(s.end-s.start);steps.forEach((e,i)=>e.classList.toggle('active',i===Math.min(steps.length-1,Math.floor(progress*steps.length))));}return active;};renderAtFrame(0);
</script></body></html>
