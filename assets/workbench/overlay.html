<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:__WIDTH__px;height:__HEIGHT__px;overflow:hidden;background:transparent;font-family:'Microsoft YaHei',sans-serif}#card{position:absolute;inset:8% 6%;border-radius:18px;background:linear-gradient(125deg,rgba(14,31,37,.95),rgba(20,48,49,.9));border:1px solid #73efca7a;padding:4% 5%;display:flex;align-items:center;gap:4%;color:white;box-shadow:0 6px 20px #0003}#card:before{content:'';position:absolute;left:0;top:25%;height:50%;width:4px;background:__ACCENT__;box-shadow:0 0 16px __ACCENT__}#content{flex:1;min-width:0}#kicker{font-size:clamp(10px,1.1vw,19px);color:__ACCENT__;letter-spacing:2px;margin-bottom:8px}#title{font-size:clamp(18px,3.2vw,64px);font-weight:800;line-height:1.3;overflow-wrap:anywhere}#picture{width:23%;height:100%;object-fit:contain}#steps{display:flex;gap:10px;align-items:center;margin-top:12px}#steps span{border:1px solid #72efcb66;background:#72efcb15;border-radius:8px;padding:7px 10px;font-size:clamp(12px,1.8vw,30px)}#steps b{color:__ACCENT__}#steps span.current{background:#72efcb44}#line{height:3px;width:100%;margin-top:14px;background:#72efcb20;border-radius:3px}#line i{display:block;height:100%;background:__ACCENT__;border-radius:3px}#draft{position:absolute;right:10px;top:3px;color:#8daaaa;font-size:9px}

</style><div id="card"><div id="content"><div id="kicker">KEY POINT</div><div id="title"></div><div id="steps"></div><div id="line"><i></i></div></div><img id="picture" alt=""></div><script>
__HCS_ENGINE__
const scenes=__SCENES__,fps=__FPS__,layout=__LAYOUT__,card=document.getElementById('card'),title=document.getElementById('title'),pic=document.getElementById('picture'),steps=document.getElementById('steps');let last='';
window.ready=Promise.all(scenes.flatMap(s=>[s.src,...(s.frames||[]).map(f=>f.src)]).filter(Boolean).map(src=>new Promise(resolve=>{const im=new Image();im.onload=im.onerror=resolve;im.src=src})));
window.renderAtFrame=function(frame){const t=frame/fps,s=scenes.find(s=>s.enabled&&s.kind!=='sfx'&&t>=s.start&&t<s.end);card.style.display=s?'flex':'none';if(!s)return false;
card.classList.toggle('fullscreen',!!s.fullscreen);card.style.top=(s.fullscreen?0:layout.regionY+layout.regionH*.08)+'px';card.style.bottom='auto';card.style.height=(s.fullscreen?layout.stageH:layout.regionH*.84)+'px';card.style.left=s.fullscreen?'0':'6%';card.style.width=s.fullscreen?'100%':'88%';
const state=valueAt(frame,{animation:{startFrame:s.start*fps,endFrame:(s.start+.25)*fps,easing:'easeOutCubic',from:{opacity:0,translateY:12,scale:.97},to:{opacity:1,translateY:0,scale:1}}});card.style.opacity=state.opacity;card.style.transform=`translateY(${state.translateY}px) scale(${state.scale})`;
if(last!==s.id){title.textContent=s.title;document.getElementById('kicker').textContent={flow:'HOW IT WORKS / 流程示意',product:'PRODUCT / 产品展示',sticker:'HIGHLIGHT / 重点',demo:'DEMONSTRATION / 演示',title:'KEY POINT / 关键信息'}[s.kind]||'KEY POINT';steps.replaceChildren();(s.steps||[]).forEach((x,i)=>{if(i){let b=document.createElement('b');b.textContent='→';steps.append(b)}let span=document.createElement('span');span.textContent=x;steps.append(span)});last=s.id}
const progress=Math.min(1,(t-s.start)/(s.end-s.start));document.querySelector('#line i').style.width=`${progress*100}%`;[...steps.querySelectorAll('span')].forEach((el,i)=>el.classList.toggle('current',i===Math.min((s.steps||[]).length-1,Math.floor(progress*(s.steps||[]).length))));
let src=s.src;if(s.frames){const tt=s.hold_last?Math.min(t-s.start,s.loop_duration-.0001):(t-s.start)%s.loop_duration;src=(s.frames.find(f=>f.start<=tt&&tt<f.end)||s.frames[0]).src}pic.style.display=src?'block':'none';if(src&&pic.getAttribute('src')!==src)pic.src=src;return true};renderAtFrame(0);
</script></html>
