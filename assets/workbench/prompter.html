body {

  height:100dvh;
  display:grid;
  grid-template-rows:auto 3px minmax(0,1fr) auto auto;
}
header { height:auto; min-height:62px; padding:12px clamp(12px,2vw,32px); gap:12px; }

#kind { margin-bottom:6px; }
#title { margin:0 0 8px; font-size:clamp(15px,2vw,20px); }
#notes { padding:0 0 8px; font-size:13px; line-height:1.4; }

#text { line-height:1.35; }
footer {
  position:static;
  min-height:0;
  padding:8px clamp(12px,2vw,32px) 6px;
